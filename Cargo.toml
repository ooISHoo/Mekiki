[workspace]
resolver = "3"
members = [
    "crates/matching",
    "crates/capture",
    "crates/input",
    "crates/overlay",
    "crates/ocr",
    "crates/uia",
    "crates/core",
    "crates/scripting",
    "crates/mcp",
    "ide/src-tauri",
    "tools/api-gen",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ooISHoo/Mekiki"
authors = ["Mekiki contributors"]

[workspace.dependencies]
# Workspace crates
mekiki-matching = { path = "crates/matching" }
mekiki-capture = { path = "crates/capture" }
mekiki-input = { path = "crates/input" }
mekiki-overlay = { path = "crates/overlay" }
mekiki-ocr = { path = "crates/ocr" }
mekiki-uia = { path = "crates/uia" }
mekiki-core = { path = "crates/core" }

mekiki-scripting = { path = "crates/scripting" }

# Scripting layer
rhai = "1.25"
sha2 = "0.10"

# IDE
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
# image-data is required to read images from the clipboard; it is not enabled
# by default.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
base64 = "0.23"

# Native OS APIs. Pinned to the version wgpu pulls in, to avoid building two copies.
windows = "0.62"

# GPU
wgpu = "30"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"

# CPU reference implementation / tests / benchmarks
rayon = "1.12"
rustfft = "6.4.1"
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

# Benchmarks and golden tests are meaningless without optimization, so
# dependencies are optimized even in the dev profile.
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
debug = true
