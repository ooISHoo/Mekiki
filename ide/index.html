<!doctype html>
<!-- lang は起動時にロケールへ差し替える（src/i18n/index.js の applyStaticText）。
     ここに書いてあるのは JS が動く前の初期値。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mekiki</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon-mekiki.svg">
<link rel="stylesheet" href="/src/style.css">
</head>
<!-- 文言は data-i18n で指す。HTML 側に日本語を残すと
     カタログ（src/i18n/ja.js）と二重管理になるため。 -->
<body>
  <header class="app-header">
    <!-- deep: 空き領域と子（アイコン・ファイル名）もドラッグ対象。
         最小化などの button は Tauri 側で除外される。 -->
    <div id="title-bar" data-tauri-drag-region="deep">
      <div class="titlebar-start">
        <img class="titlebar-icon" src="/icons/icon-mekiki.svg" alt="" width="16" height="16">
        <span class="brand">Mekiki</span>
      </div>
      <span id="script-name"></span>
      <div class="titlebar-controls">
        <button id="titlebar-minimize" class="titlebar-btn"
                data-i18n-title="titlebar.minimize.hint"
                data-i18n-aria-label="titlebar.minimize.hint">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" /></svg>
        </button>
        <button id="titlebar-maximize" class="titlebar-btn"
                data-i18n-title="titlebar.maximize.hint"
                data-i18n-aria-label="titlebar.maximize.hint">
          <svg class="icon-maximize" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="1.5" y="1.5" width="7" height="7" rx="0.4" />
          </svg>
          <svg class="icon-restore" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M3 3.5h4.5v4.5H3z" />
            <path d="M4 2.5h4.5V7" />
          </svg>
        </button>
        <button id="titlebar-close" class="titlebar-btn titlebar-close"
                data-i18n-title="titlebar.close.hint"
                data-i18n-aria-label="titlebar.close.hint">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
        </button>
      </div>
    </div>
    <div class="toolbar">
      <div class="group">
        <button id="btn-new" class="icon-button"
                data-i18n-title="toolbar.new.hint"
                data-i18n-aria-label="toolbar.new.hint">
          <img src="/icons/icon-new.svg" alt="" width="16" height="16">
        </button>
        <button id="btn-open" class="icon-button"
                data-i18n-title="toolbar.open.hint"
                data-i18n-aria-label="toolbar.open.hint">
          <img src="/icons/icon-open.svg" alt="" width="16" height="16">
        </button>
        <button id="btn-save" class="icon-button" disabled
                data-i18n-title="toolbar.save.hint"
                data-i18n-aria-label="toolbar.save.hint">
          <img src="/icons/icon-save.svg" alt="" width="16" height="16">
        </button>
        <button id="btn-save-as" class="icon-button"
                data-i18n-title="toolbar.saveAs.hint"
                data-i18n-aria-label="toolbar.saveAs.hint">
          <img src="/icons/icon-save-as.svg" alt="" width="16" height="16">
        </button>
      </div>
      <div class="toolbar-sep" role="separator"></div>

      <div class="group">
        <button id="btn-run" class="icon-button primary"
                data-i18n-title="toolbar.run.hint"
                data-i18n-aria-label="toolbar.run.hint">
          <img src="/icons/icon-run.svg" alt="" width="16" height="16">
        </button>
        <!-- 実行中だけ有効。停止は「意図しない操作を止める」ための非常口なので
             実行ボタンの隣に置く。 -->
        <button id="btn-pause" class="icon-button" disabled
                data-i18n-title="toolbar.pause.hint"
                data-i18n-aria-label="toolbar.pause.hint">
          <img src="/icons/icon-pause.svg" alt="" width="16" height="16">
        </button>
        <button id="btn-stop" class="icon-button danger" disabled
                data-i18n-title="toolbar.stop.hint"
                data-i18n-aria-label="toolbar.stop.hint">
          <img src="/icons/icon-stop.svg" alt="" width="16" height="16">
        </button>
      </div>

      <div class="group">
        <!-- ステップは実行前にも入れておける（最初の文で止まる）。 -->
        <button id="btn-step-mode" class="icon-button" aria-pressed="false"
                data-i18n-title="toolbar.stepMode.hint"
                data-i18n-aria-label="toolbar.stepMode.hint">
          <img src="/icons/icon-step-mode.svg" alt="" width="16" height="16">
        </button>
        <button id="btn-step-next" class="icon-button" disabled
                data-i18n-title="toolbar.stepNext.hint"
                data-i18n-aria-label="toolbar.stepNext.hint">
          <img src="/icons/icon-step-next.svg" alt="" width="16" height="16">
        </button>
      </div>
      <div class="toolbar-sep" role="separator"></div>
      <div class="group">
        <button id="btn-settings" class="icon-button"
                data-i18n-title="toolbar.settings.hint"
                data-i18n-aria-label="toolbar.settings.hint">
          <img src="/icons/icon-settings.svg" alt="" width="16" height="16">
        </button>
      </div>

      <div class="group grow">
        <div class="base-dir" data-i18n-title="toolbar.baseDir.hint">
          <span data-i18n="toolbar.baseDir"></span>
          <span id="base-dir" class="base-dir-path"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- 上下 2 段。上段をさらに左右へ割る。
       右ペインは画像リソースとウィンドウのタブ。下段は出力のみ。 -->
  <main>
    <div id="top">
      <div id="editor"></div>
      <div id="split-right" class="splitter splitter-v"
           role="separator" aria-orientation="vertical" tabindex="0"
           data-i18n-aria-label="splitter.right"></div>
      <aside id="side-right">
        <div class="side-tabs">
          <button class="tab active" data-panel="assets" data-i18n="assets.title"></button>
          <button class="tab" data-panel="windows" data-i18n="tab.windows"></button>
        </div>

        <!-- タイルを選ぶとマッチ確認の対象になる。ダブルクリックで挿入。 -->
        <section id="panel-assets" class="side-panel active">
          <div class="pane-head">
            <span id="assets-count" class="pane-meta"></span>
            <button id="btn-snip" class="icon-button"
                    data-i18n-title="toolbar.snip.hint"
                    data-i18n-aria-label="toolbar.snip.hint">
              <img src="/icons/icon-snip.svg" alt="" width="16" height="16">
            </button>
            <button id="btn-paste" class="icon-button"
                    data-i18n-title="toolbar.paste.hint"
                    data-i18n-aria-label="toolbar.paste.hint">
              <img src="/icons/icon-paste.svg" alt="" width="16" height="16">
            </button>
            <button id="btn-refresh-assets" class="icon-button"
                    data-i18n-title="assets.refresh.hint"
                    data-i18n-aria-label="assets.refresh.hint">
              <img src="/icons/icon-refresh.svg" alt="" width="16" height="16">
            </button>
            <div class="tile-size">
              <button id="btn-tile-size-minus" class="icon-button"
                      data-i18n-title="assets.tileSize.smaller.hint"
                      data-i18n-aria-label="assets.tileSize.smaller.hint">
                <img src="/icons/icon-tile-size-minus.svg" alt="" width="16" height="16">
              </button>
              <input id="tile-size" type="range" min="48" max="240" step="8" value="96"
                     data-i18n-title="assets.tileSize.hint"
                     data-i18n-aria-label="assets.tileSize.hint">
              <button id="btn-tile-size-plus" class="icon-button"
                      data-i18n-title="assets.tileSize.larger.hint"
                      data-i18n-aria-label="assets.tileSize.larger.hint">
                <img src="/icons/icon-tile-size-plus.svg" alt="" width="16" height="16">
              </button>
            </div>
          </div>

          <div id="assets" class="tiles"></div>

          <div class="preview-controls">
            <label class="field">
              <span data-i18n="preview.similarity"></span>
              <input id="similarity" type="range" min="0.5" max="1" step="0.01" value="0.9">
              <output id="similarity-value">0.90</output>
            </label>
            <button id="btn-preview-run" data-i18n="toolbar.preview"
                    data-i18n-title="toolbar.preview.hint"></button>
          </div>
        </section>

        <section id="panel-windows" class="side-panel">
          <div id="windows"></div>
          <div class="pane-foot">
            <button id="btn-refresh-windows" data-i18n="windows.refresh"></button>
          </div>
        </section>
      </aside>
    </div>

    <div id="split-bottom" class="splitter splitter-h"
         role="separator" aria-orientation="horizontal" tabindex="0"
         data-i18n-aria-label="splitter.bottom"></div>

    <section id="bottom">
      <pre id="output"></pre>
    </section>
  </main>

  <footer id="status-bar">
    <div id="status" data-i18n="status.starting"></div>
    <div id="cursor-pos" data-i18n-title="status.cursor.hint"></div>
  </footer>

  <dialog id="settings-dialog" class="settings-dialog">
    <div class="settings-head">
      <h2 data-i18n="settings.title"></h2>
    </div>
    <div class="settings-body">
      <label class="settings-row">
        <span data-i18n="settings.language"></span>
        <select id="settings-language">
          <option value="system" data-i18n="settings.language.system"></option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="settings-row">
        <span data-i18n="settings.theme"></span>
        <select id="settings-theme">
          <option value="system" data-i18n="settings.theme.system"></option>
          <option value="light" data-i18n="settings.theme.light"></option>
          <option value="dark" data-i18n="settings.theme.dark"></option>
        </select>
      </label>
      <label class="settings-row">
        <span data-i18n="settings.editorFont"></span>
        <input id="settings-editor-font" type="number" min="11" max="22" step="1" value="13">
      </label>
    </div>
    <div class="settings-actions">
      <button id="settings-apply" type="button" data-i18n="settings.apply"></button>
      <button id="settings-close" type="button" data-i18n="settings.close"></button>
    </div>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
