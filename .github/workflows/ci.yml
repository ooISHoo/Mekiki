name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The IDE is a Tauri app and cannot build without the frontend output
      # (tauri-build checks that frontendDist exists).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - run: npm ci
        working-directory: ide
      - run: npm run build
        working-directory: ide
      - run: cargo run -p mekiki-api-gen -- --check
      - run: cargo fmt --all -- --check
      # custom-protocol is required: without it the IDE is treated as a dev
      # build that expects the Vite dev server.
      - run: cargo clippy --workspace --all-targets --features mekiki-ide/custom-protocol -- -D warnings

  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - run: npm ci
        working-directory: ide
      - run: npm run build
        working-directory: ide
      # Tests run in release: the CPU reference implementation is orders of
      # magnitude slower in debug and the golden cases would not finish.
      #
      # MEKIKI_REQUIRE_GPU is deliberately not set. GitHub's Windows runners
      # have no GPU; the GPU path is verified by the portability job below
      # (lavapipe). The only adapter on the runner is the WARP software
      # rasterizer, which crashed the process through wgpu, so the engine
      # refuses software adapters by default and falls back to the CPU path
      # unless MEKIKI_ALLOW_SOFTWARE_GPU is set.
      #
      # Tests that need a real desktop, GPU, or language pack are not part of
      # this job; they belong to the release validation on a real machine
      # (docs/testing.md).
      - run: cargo test --workspace --release --features mekiki-ide/custom-protocol

      # When a child process dies before main() (for example
      # STATUS_ENTRYPOINT_NOT_FOUND, 0xc0000139) the test only sees a closed
      # pipe. The loader's own message lands in the System event log, so dump
      # it here together with the binary's exit code.
      - name: Diagnose a server that failed to start
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- mekiki-mcp --help ---"
          & target\release\mekiki-mcp.exe --help
          Write-Host "exit code: $LASTEXITCODE"
          Write-Host "--- comctl32 ---"
          (Get-Item C:\Windows\System32\comctl32.dll).VersionInfo | Format-List FileVersion, ProductVersion
          Write-Host "--- System log: loader popups (event 26) ---"
          Get-WinEvent -FilterHashtable @{LogName='System'; Id=26} -MaxEvents 20 -ErrorAction SilentlyContinue |
            ForEach-Object { $_.TimeCreated.ToString('s') + '  ' + ($_.Message -replace "`r?`n", ' ') }
          Write-Host "--- Application log: recent errors ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 20 -ErrorAction SilentlyContinue |
            ForEach-Object { $_.TimeCreated.ToString('s') + '  ' + $_.ProviderName + '  ' + ($_.Message -replace "`r?`n", ' ') }

  # Linux is not a target platform. This job is a design check:
  #
  #   1. OS-dependent code stays inside capture / input (a leak breaks the
  #      build here).
  #   2. GPU shader regressions are caught by really running the shaders on
  #      lavapipe, even though the runner has no GPU.
  portability:
    name: non-Windows build + GPU shader check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true

      # Confirms that OS dependencies do not leak into the upper layers.
      # The IDE (Tauri) needs extra system libraries on Linux and is excluded:
      # this checks the portability of the core, not of the GUI.
      - run: cargo build --release -p mekiki-matching -p mekiki-capture -p mekiki-input -p mekiki-overlay -p mekiki-core -p mekiki-scripting

      # lavapipe is available, so a skipped GPU path is a failure here. It is
      # a software rasterizer, which the engine refuses by default; allow it
      # explicitly.
      - name: Matching golden tests (including the GPU path)
        run: cargo test -p mekiki-matching --release
        env:
          MEKIKI_REQUIRE_GPU: "1"
          MEKIKI_ALLOW_SOFTWARE_GPU: "1"
          WGPU_BACKEND: vulkan

      - name: Platform-independent crate tests
        run: cargo test -p mekiki-core -p mekiki-capture -p mekiki-input --release
        env:
          MEKIKI_ALLOW_SOFTWARE_GPU: "1"
          WGPU_BACKEND: vulkan

  goldens:
    name: golden fixtures match OpenCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/golden/requirements.txt
      # Recomputes the committed expectations with OpenCV without regenerating
      # them. Guards against "make the test pass by editing the goldens".
      - run: python tools/golden/gen_golden.py --check
